services:
  review-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: review-agent:1.0.0
    container_name: review-agent
    env_file:
      - ../.env
    environment:
      REVIEWAGENT_HOME: /opt/review-agent
      REVIEWAGENT_ENABLE_SCRAPING: "0"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../data:/opt/review-agent/data
      - ../output:/opt/review-agent/output
      - review-agent-cache:/opt/review-agent/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  review-agent-cache:
