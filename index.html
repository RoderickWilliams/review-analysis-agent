t;&lt;td&gt;'+r.platform+'&lt;/td&gt;&lt;td class=&quot;'+r.sentiment+'-text&quot;&gt;'+labels[r.sentiment]+'&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;badge&quot;&gt;'+(marks[r.id]|| (r.flag?'需复核':'未标记'))+'&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;').join('')+'&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;'}&#10;function overview(){return '&lt;section class=&quot;overview&quot;&gt;&lt;div class=&quot;score-panel&quot;&gt;&lt;span class=&quot;muted&quot;&gt;评论可信度 · 示例信号&lt;/span&gt;&lt;div class=&quot;score&quot;&gt;82&lt;small&gt;/ 100&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;muted&quot;&gt;用于内容复核，不是真实性概率&lt;/span&gt;&lt;div class=&quot;score-pair&quot;&gt;&lt;div class=&quot;muted&quot;&gt;已分析 / 样本&lt;b&gt;12 / 12&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;muted&quot;&gt;需复核&lt;b&gt;1 条&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;plot&quot;&gt;&lt;div class=&quot;plot-head&quot;&gt;&lt;span&gt;用户评分分布&lt;/span&gt;&lt;span class=&quot;muted&quot;&gt;按已知评分统计&lt;/span&gt;&lt;/div&gt;'+ratingPie(reviews)+'&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;split&quot;&gt;&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;情绪概况&lt;/h2&gt;'+[['positive',8],['negative',3],['neutral',1]].map(([s,n])=&gt;'&lt;div class=&quot;bar '+s+'&quot;&gt;&lt;span&gt;'+labels[s]+'&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;i style=&quot;width:'+n/12*100+'%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;span&gt;'+n+'&lt;/span&gt;&lt;/div&gt;').join('')+'&lt;/section&gt;&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;样本来源与边界&lt;/h2&gt;&lt;div class=&quot;source&quot;&gt;&lt;span&gt;淘宝 / 天猫&lt;/span&gt;&lt;b&gt;5 条商品评价&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;source&quot;&gt;&lt;span&gt;京东&lt;/span&gt;&lt;b&gt;5 条商品评价&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;source&quot;&gt;&lt;span&gt;小红书&lt;/span&gt;&lt;b&gt;2 条社交评论&lt;/b&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;section-bar&quot;&gt;&lt;h2&gt;从原文开始&lt;/h2&gt;&lt;button class=&quot;text-button&quot; data-view=&quot;reviews&quot;&gt;查看全部评论 ↗&lt;/button&gt;&lt;/div&gt;'+table(reviews.slice(0,3))}&#10;function reviewView(){return '&lt;div class=&quot;toolbar&quot;&gt;&lt;input id=&quot;search&quot; type=&quot;search&quot; placeholder=&quot;搜索评论原文，如：包装、手感…&quot; aria-label=&quot;搜索评论原文&quot; value=&quot;'+esc(query)+'&quot;&gt;&lt;select id=&quot;platform&quot; aria-label=&quot;平台筛选&quot;&gt;&lt;option value=&quot;all&quot;&gt;全部平台&lt;/option&gt;'+['淘宝 / 天猫','京东','小红书'].map(x=&gt;'&lt;option '+(platform===x?'selected':'')+'&gt;'+x+'&lt;/option&gt;').join('')+'&lt;/select&gt;&lt;select id=&quot;sentiment&quot; aria-label=&quot;情绪筛选&quot;&gt;&lt;option value=&quot;all&quot;&gt;全部情绪&lt;/option&gt;'+Object.entries(labels).map(([k,v])=&gt;'&lt;option value=&quot;'+k+'&quot; '+(sentiment===k?'selected':'')+'&gt;'+v+'&lt;/option&gt;').join('')+'&lt;/select&gt;&lt;/div&gt;&lt;div id=&quot;review-results&quot;&gt;&lt;/div&gt;'}&#10;function filterReviews(){const items=reviews.filter(r=&gt;(platform==='all'||r.platform===platform)&amp;&amp;(sentiment==='all'||r.sentiment===sentiment)&amp;&amp;(!query||r.text.toLowerCase().includes(query.toLowerCase())));$('#review-results').innerHTML='&lt;p class=&quot;count&quot;&gt;'+items.length+' 条匹配 / 共 12 条样例&lt;/p&gt;'+(items.length?table(items):'&lt;div class=&quot;empty&quot;&gt;&lt;h3&gt;没有匹配的评论&lt;/h3&gt;&lt;p&gt;换个关键词，或调整平台与情绪筛选。&lt;/p&gt;&lt;/div&gt;')}&#10;function insightView(){return insights.map(i=&gt;'&lt;article class=&quot;insight&quot;&gt;&lt;span class=&quot;badge&quot;&gt;'+i.category+' · '+i.ids.length+' 条样例依据&lt;/span&gt;&lt;h3 style=&quot;margin-top:11px&quot;&gt;'+i.title+'&lt;/h3&gt;&lt;p&gt;'+i.text+'&lt;/p&gt;'+i.ids.map(id=&gt;{const r=reviews.find(r=&gt;r.id===id);return '&lt;blockquote&gt;“'+esc(r.text)+'”&lt;button class=&quot;text-button&quot; data-evidence=&quot;'+id+'&quot;&gt;查看 '+id+' 完整依据&lt;/button&gt;&lt;/blockquote&gt;'}).join('')+'&lt;/article&gt;').join('')}&#10;function actionsView(){return tasks.map((t,i)=&gt;'&lt;article class=&quot;task&quot;&gt;&lt;span class=&quot;badge&quot;&gt;'+t.priority+'&lt;/span&gt;&lt;div&gt;&lt;h3&gt;'+esc(t.title)+'&lt;/h3&gt;&lt;p&gt;负责人：'+esc(t.owner)+'&lt;/p&gt;&lt;p&gt;验证指标：'+esc(t.metric)+'&lt;/p&gt;&lt;button class=&quot;text-button&quot; data-evidence=&quot;'+t.ids[0]+'&quot;&gt;查看原文依据&lt;/button&gt;&lt;/div&gt;&lt;select data-status=&quot;'+i+'&quot; aria-label=&quot;'+esc(t.title)+'状态&quot;&gt;'+['待确认','进行中','已完成'].map(s=&gt;'&lt;option '+(s===t.status?'selected':'')+'&gt;'+s+'&lt;/option&gt;').join('')+'&lt;/select&gt;&lt;button class=&quot;button&quot; data-edit=&quot;'+i+'&quot;&gt;编辑&lt;/button&gt;&lt;/article&gt;').join('')+'&lt;div class=&quot;section-bar&quot;&gt;&lt;h2&gt;按需生成运营草稿&lt;/h2&gt;&lt;span class=&quot;muted&quot;&gt;浏览器内样例生成&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;draft-buttons&quot;&gt;'+['商品卖点','客服话术','内容选题'].map(x=&gt;'&lt;button class=&quot;button&quot; data-generate=&quot;'+x+'&quot;&gt;生成'+x+'&lt;/button&gt;').join('')+'&lt;/div&gt;&lt;div id=&quot;drafts&quot;&gt;'+Object.entries(drafts).map(([k,v])=&gt;'&lt;article class=&quot;draft&quot;&gt;&lt;h3&gt;'+k+'&lt;/h3&gt;&lt;textarea data-draft=&quot;'+k+'&quot; aria-label=&quot;'+k+'草稿&quot;&gt;'+esc(v)+'&lt;/textarea&gt;&lt;small&gt;可以直接编辑；刷新后恢复初始状态。&lt;/small&gt;&lt;/article&gt;').join('')+'&lt;/div&gt;'}&#10;function render(){const titles={overview:'研究总览',reviews:'评论库',insights:'用户洞察',actions:'行动计划',history:'分析历史'};$('#page-title').innerHTML=titles[current]+' &lt;span class=&quot;badge&quot;&gt;演示模式&lt;/span&gt;';document.querySelectorAll('[data-view]').forEach(b=&gt;{b.classList.toggle('active',b.dataset.view===current);if(b.closest('nav'))b.setAttribute('aria-current',b.dataset.view===current?'page':'false')});$('#view').innerHTML=current==='overview'?overview():current==='reviews'?reviewView():current==='insights'?insightView():current==='actions'?actionsView():history?'&lt;article class=&quot;history-item&quot;&gt;&lt;div&gt;&lt;h3&gt;植间 · 日常保湿护手霜&lt;/h3&gt;&lt;p&gt;12 条样例 · 3 个平台 · 已完成分析&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;button primary&quot; data-view=&quot;overview&quot;&gt;打开研究&lt;/button&gt;&lt;/article&gt;':'&lt;div class=&quot;empty&quot;&gt;&lt;h3&gt;演示记录已清空&lt;/h3&gt;&lt;p&gt;点击下方按钮恢复样例，继续体验。&lt;/p&gt;&lt;button class=&quot;button primary&quot; id=&quot;restore&quot;&gt;恢复演示样例&lt;/button&gt;&lt;/div&gt;';if(current==='reviews')filterReviews()}&#10;function showEvidence(id){const r=reviews.find(x=&gt;x.id===id);$('#detail-title').textContent='评论原文与依据';$('#detail-body').innerHTML='&lt;span class=&quot;badge&quot;&gt;虚构样例 · '+r.id+'&lt;/span&gt;&lt;blockquote class=&quot;evidence-quote&quot;&gt;'+esc(r.text)+'&lt;/blockquote&gt;&lt;dl&gt;&lt;div&gt;&lt;dt&gt;来源&lt;/dt&gt;&lt;dd&gt;'+r.platform+'&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;内容类型&lt;/dt&gt;&lt;dd&gt;'+(r.platform==='小红书'?'社交评论':'商品评价')+'&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;情绪&lt;/dt&gt;&lt;dd&gt;'+labels[r.sentiment]+'&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;p&gt;'+ (r.flag?'措辞高度重复，示例规则将其标记为需人工复核。该提示不能证明评论虚假。':'这条样例包含具体的使用感受，可作为运营判断的参考。')+'&lt;/p&gt;&lt;p&gt;人工标记仅影响当前演示，不会写入真实语料库。&lt;/p&gt;&lt;div class=&quot;draft-buttons&quot;&gt;&lt;button class=&quot;button&quot; data-mark=&quot;'+id+'&quot; data-label=&quot;参考好评&quot;&gt;参考好评&lt;/button&gt;&lt;button class=&quot;button&quot; data-mark=&quot;'+id+'&quot; data-label=&quot;需人工复核&quot;&gt;需人工复核&lt;/button&gt;&lt;/div&gt;';$('#detail').showModal()}&#10;const samples={'商品卖点':'轻薄易推开的质地，给忙碌工位留一点护手时间。\n\n正向样例依据：R-001 提到质地易推开；R-002 提到吸收快、使用键盘没有明显油印。\n使用前请确认成分、净含量与商品实际参数。','客服话术':'您好，这款默认使用普通包装。如果您准备送礼，建议先确认是否需要另配礼盒。我们可以为您核实包装内容。\n\n样例依据：R-004、R-005。请按店铺实际服务修改。','内容选题':'选题：洗手后的一分钟，给工位留一点护手时间\n场景：办公室 / 洗手后日常护理\n内容：工位开场 → 展示质地与涂抹感受 → 分享键盘使用场景\n\n正向样例依据：R-002、R-008。未核实的产品参数不写入文案。'};&#10;document.addEventListener('click',event=&gt;{const b=event.target.closest('button');if(!b)return;if(b.dataset.view){current=b.dataset.view;render();$('#content').scrollTop=0}if(b.dataset.evidence)showEvidence(b.dataset.evidence);if(b.dataset.mark){marks[b.dataset.mark]=b.dataset.label;$('#detail').close();render();toast('已更新当前演示的人工标记')}if(b.dataset.edit){const i=Number(b.dataset.edit),t=tasks[i];$('#detail-title').textContent='编辑运营行动';$('#detail-body').innerHTML='&lt;form id=&quot;edit-form&quot; data-index=&quot;'+i+'&quot;&gt;&lt;label&gt;行动标题&lt;input name=&quot;title&quot; value=&quot;'+esc(t.title)+'&quot; required maxlength=&quot;100&quot;&gt;&lt;/label&gt;&lt;label&gt;负责人&lt;input name=&quot;owner&quot; value=&quot;'+esc(t.owner)+'&quot; required maxlength=&quot;50&quot;&gt;&lt;/label&gt;&lt;label&gt;验证指标&lt;textarea name=&quot;metric&quot; required maxlength=&quot;300&quot;&gt;'+esc(t.metric)+'&lt;/textarea&gt;&lt;/label&gt;&lt;button class=&quot;button primary&quot; type=&quot;submit&quot;&gt;保存行动&lt;/button&gt;&lt;/form&gt;';$('#detail').showModal()}if(b.dataset.generate){drafts[b.dataset.generate]??=samples[b.dataset.generate];render();toast('已生成样例草稿，可以直接编辑')}if(b.id==='close')$('#detail').close();if(b.id==='reset'){$('#detail-title').textContent='重置演示工作区';$('#detail-body').innerHTML='&lt;p&gt;将清空当前演示中的研究记录、人工标记和编辑内容。只影响此演示，随时可以恢复样例。&lt;/p&gt;&lt;button class=&quot;button primary&quot; id=&quot;confirm-reset&quot;&gt;确认重置演示&lt;/button&gt;';$('#detail').showModal()}if(b.id==='confirm-reset'){history=false;tasks=JSON.parse(initialTasks);marks={};drafts={};current='history';$('#detail').close();render();toast('演示工作区已重置')}if(b.id==='restore'){history=true;current='overview';render()}if(b.id==='fullscreen')window.open('demo.html','_blank','noopener');if(b.id==='export'){const payload={demo:true,notice:'所有内容为虚构演示样例',reviews,insights,tasks,marks,drafts};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ReviewAgent-demo-report.json';a.click();setTimeout(()=&gt;URL.revokeObjectURL(url),1000);toast('已导出演示报告 JSON')}});&#10;document.addEventListener('input',event=&gt;{if(event.target.id==='search'){query=event.target.value;filterReviews()}if(event.target.dataset.draft)drafts[event.target.dataset.draft]=event.target.value});&#10;document.addEventListener('change',event=&gt;{if(event.target.id==='platform'){platform=event.target.value;filterReviews()}if(event.target.id==='sentiment'){sentiment=event.target.value;filterReviews()}if(event.target.dataset.status){tasks[Number(event.target.dataset.status)].status=event.target.value;toast('行动状态已更新')}});&#10;document.addEventListener('submit',event=&gt;{if(event.target.id!=='edit-form')return;event.preventDefault();const i=Number(event.target.dataset.index),data=new FormData(event.target);Object.assign(tasks[i],Object.fromEntries(data));$('#detail').close();render();toast('行动已保存到当前演示')});&#10;render();&#10;&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;&#10;" title="ReviewAgent 护手霜演示工作台"></iframe></main></body></html>
