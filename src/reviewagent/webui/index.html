<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ReviewAgent · 评论研究工作台</title>
  <link rel="stylesheet" href="workbench.css"><script src="workbench-extra.js" defer></script><script src="workbench.js" defer></script>
</head>
<body>
<a class="skip" href="#content">跳到工作区</a>
<div class="shell">
  <aside class="sidebar" aria-label="工作台导航">
    <a class="brand" href="./" aria-label="ReviewAgent 首页"><img src="logo.png" alt="ReviewAgent" width="196" height="48"></a>
    <button class="workspace" id="new-workspace"><span class="avatar">R</span><span>评论研究工作台<small>本地工作区</small></span><span aria-hidden="true">⌄</span></button>
    <p class="nav-label">工作区</p>
    <nav id="navigation">
      <button data-view="overview" class="nav-item active" aria-current="page"><span aria-hidden="true">▦</span>总览</button>
      <button data-view="reviews" class="nav-item"><span aria-hidden="true">☷</span>评论库<span class="nav-count" id="nav-review-count">0</span></button>
      <button data-view="products" class="nav-item"><span aria-hidden="true">▤</span>商品与规格</button>
      <button data-view="insights" class="nav-item"><span aria-hidden="true">◷</span>用户洞察</button>
      <button data-view="actions" class="nav-item"><span aria-hidden="true">☑</span>行动计划</button>
    </nav>
    <div class="nav-divider"></div><p class="nav-label">记录</p>
    <button data-view="history" class="nav-item"><span aria-hidden="true">↶</span>分析历史</button>
    <div class="sidebar-bottom"><button id="reset-workspace" class="nav-item reset-button" title="清空分析历史与当前工作区，保留模型设置和平台登录">重置</button><button class="nav-item" id="help"><span aria-hidden="true">ⓘ</span>使用与快捷键</button><div class="connection"><i id="connection-dot"></i><span id="connection-status">连接中</span></div><div class="profile"><span class="avatar">本</span><span>本地工作区<small id="model-label">模型状态待连接</small></span><button class="icon-button" id="settings" aria-label="工作台设置">⚙</button></div></div>
  </aside>
  <div class="workspace-main">
    <header class="topbar"><div class="breadcrumb"><span aria-hidden="true">▦</span><span>评论研究</span><span class="environment">Workspace</span></div><button class="global-search" id="global-search"><span aria-hidden="true">⌕</span><span>搜索评论与证据…</span><kbd>Enter</kbd></button><button class="icon-button" id="top-help" aria-label="使用说明">ⓘ</button><button class="icon-button" id="top-settings" aria-label="工作台设置">⚙</button></header>
    <main id="content" tabindex="-1">
      <div class="page-heading"><div><div class="eyebrow" id="object-context">REVIEW INTELLIGENCE</div><h1><span id="page-title">研究总览</span><span class="badge" id="analysis-status">待创建</span></h1><p id="page-description">从评论原文出发，找到值得改进的地方。</p></div><div class="heading-actions"><button id="export" class="button" disabled>↓ 导出</button><button id="new-analysis" class="button primary">＋ 新建分析</button></div></div>
      <div id="message" role="status" class="message" hidden></div>
      <section id="job-progress" class="job-progress" aria-label="任务进度" hidden><div><strong id="progress-label">处理中</strong><span id="progress-text"></span></div><progress id="progress-bar" max="100" value="0"></progress><button class="button" id="cancel-job">取消任务，保留进度</button></section>
      <div id="view-content"></div>
      <footer class="page-footer"><span id="footer-count">尚未选择分析</span><span>ReviewAgent <span id="version"></span> · 原文可追溯</span></footer>
    </main>
  </div>
</div>
<dialog id="modal" aria-labelledby="modal-title"><form id="modal-form"><header class="dialog-heading"><div><small id="modal-eyebrow">REVIEWAGENT</small><h2 id="modal-title"></h2></div><button type="button" data-close class="icon-button" aria-label="关闭">×</button></header><div id="modal-body"></div><p class="form-error" id="modal-error" role="alert" hidden></p><footer class="dialog-footer" id="modal-footer"><button type="button" class="button" data-close>取消</button><button type="submit" class="button primary" id="modal-submit">保存</button></footer></form></dialog>
<dialog id="evidence" class="evidence-drawer" aria-labelledby="evidence-title"><header class="dialog-heading"><div><small>原文与分析依据</small><h2 id="evidence-title">评论证据</h2></div><button class="icon-button" data-close-evidence aria-label="关闭证据">×</button></header><div id="evidence-content"></div></dialog>
</body></html>
