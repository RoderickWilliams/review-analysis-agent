      }
    }

    /* Keep the topic selector visible while reading the selected discussion. */
    @media screen and (min-width:900px){

      .topic-map-column{display:flex;flex-direction:column;min-height:0}.map-legend{font-size:12px;margin-bottom:10px}.topic-map-column>.note{font-size:12px;line-height:1.6;margin:10px 0 0}
      .topic-map{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(74px,1fr);gap:8px;flex:1;min-height:0;overflow:auto;padding:3px;scrollbar-width:thin;scrollbar-color:var(--smoke) transparent}
      .topic-tile{padding:10px 11px;gap:5px;border-radius:5px}.tile-index{font-size:15px}.tile-count{font-size:11px}.tile-count b{font-size:15px}.tile-title{font-size:14px;line-height:1.5}.tile-keywords,.tile-open{display:none}.tile-meter{height:3px;margin-top:auto}
      .topic-tile[aria-pressed="true"]{background:#E8DDD0;border-color:var(--brand);box-shadow:inset 3px 0 var(--brand)}
      .topic-detail-column{margin:0;padding:0 18px 18px;border:1px solid var(--line);border-radius:5px;background:var(--paper);overflow:auto;overscroll-behavior:contain;min-height:0;scrollbar-width:thin;scrollbar-color:var(--smoke) transparent}
      .detail-toolbar{position:sticky;top:0;z-index:1;background:var(--paper);padding:14px 0 12px;border-bottom:1px solid var(--line);margin:0;font-size:12px}.detail-toolbar a{display:none}.detail-toolbar:after{content:"可在此处向下阅读";color:var(--smoke);font-size:11px;white-space:nowrap}
      .topic-detail-column .topic-card{padding:20px 0 0;border:0;border-radius:0}.topic-detail-column .topic-card h3{font-size:21px}.topic-detail-column .topic-card p{font-size:15px}.topic-detail-column .topic-meta{font-size:12px;gap:6px 12px}.topic-detail-column .quote{padding:12px 14px}.topic-detail-column .quote footer{flex-wrap:wrap}.topic-detail-column:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
    }

    /* Numbered findings and portrait editorial topic covers. */
    .card-art{display:block;width:100%;height:110px;color:var(--brand)}

    .opportunity[open] .cover-open{display:none}.opportunity[open] .cover-close{display:inline}
    @media screen{
      #attraction,#opportunities{scroll-margin-top:0}
      .insight-list{display:block}.insight{display:grid;grid-template-columns:52px minmax(0,1fr);gap:20px;padding:25px 0}.insight .count{font-size:27px;line-height:1.4;margin:0}.insight h3{font-size:21px;margin-bottom:10px}.insight .explain{max-width:960px;line-height:1.85}.insight details{margin-top:10px}
      .op-card-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
      .op-card-grid .opportunity{border:0;background:transparent;border-radius:6px;overflow:visible}
      .op-preview{width:100%;aspect-ratio:3/4;margin:0;padding:24px;display:flex;flex-direction:column;gap:14px;background:#FFFCF7;border:1px solid #D9C6B1;border-radius:6px;box-shadow:0 5px 16px #221A1208;position:relative;container-type:inline-size;transition:box-shadow .18s,border-color .18s}
      .op-preview:hover{box-shadow:0 8px 24px #221A1216;border-color:var(--brand)}.op-preview:focus-visible{outline:3px solid var(--brand);outline-offset:5px}
      .op-preview .card-art{height:clamp(70px,31cqw,110px);flex-shrink:0;margin:3px 0 0}
      .op-preview h3{font-family:"Songti SC","STSong",serif;font-size:clamp(19px,7.8cqw,26px);font-weight:700;line-height:1.52;letter-spacing:.025em;margin:0;color:var(--ink);text-wrap:pretty;overflow-wrap:anywhere}
      .op-preview .signal-badges{margin-top:auto;gap:5px}.op-preview .signal-badge{font-size:10px;padding:2px 6px;border:1px solid #D9C6B1;border-radius:3px;color:var(--muted);line-height:1.6;background:transparent}
      .op-preview .card-bottom{border-top:1px solid #D9C6B1;padding-top:12px;font-size:10px;color:var(--muted);line-height:1.5}.cover-open,.cover-close{font-size:12px;color:var(--brand);white-space:nowrap}
      .opportunity:nth-child(3n+2)>.op-preview{background:#EEE2D2}.opportunity:nth-child(6n+3)>.op-preview{background:#A0622A;border-color:#A0622A;color:#FFFCF7}
      .opportunity:nth-child(6n+3)>.op-preview :is(h3,.card-meta,.card-art,.card-bottom,.cover-open,.cover-close,.signal-badge){color:#FFFCF7}.opportunity:nth-child(6n+3)>.op-preview :is(.card-bottom,.signal-badge){border-color:#FFFFFF65}
      .opportunity[open]{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px;align-items:start}
      .opportunity[open]>.op-preview{margin:0;border-bottom:1px solid #D9C6B1;position:sticky;top:100px}
      .opportunity[open]>.op-body{padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:6px;min-width:0}
      @media(min-width:741px) and (max-width:1000px){.op-card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.opportunity[open]{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}}
      @media(max-width:740px){.insight{grid-template-columns:30px minmax(0,1fr);gap:12px;padding:22px 0}.insight .count{font-size:22px}.insight h3{font-size:19px}.op-card-grid{grid-template-columns:1fr;gap:22px}.opportunity[open]{display:block}.opportunity[open]>.op-preview{position:static}.opportunity[open]>.op-body{margin-top:14px;padding:18px}.op-preview{padding:24px;max-width:440px;margin:auto}.op-preview h3{font-size:clamp(21px,7.8cqw,28px)}}
      @media(prefers-reduced-motion:reduce){.op-preview{transition:none}}
    }
    @media print{
      .card-art{width:150px;height:70px;margin:6px auto}.card-meta{font-size:9pt}.card-bottom{display:none}.op-preview h3{font-size:14pt;margin:6px 0 12px}
    }
  </style></head><body>
<a class="skip" href="#main">跳到报告正文</a><div class="shell"><aside class="sidebar" aria-label="报告导航"><div class="brand"><span class="brandmark" aria-hidden="true"></span>苏苏进化论 · 评论研究</div><p class="side-caption">从同行的评论里，找需求</p><div class="account"><div class="account-name">@@ACCOUNT@@</div><div class="account-id">@@HANDLE@@</div></div><nav class="nav"><a href="#attraction" aria-current="location"><span class="nav-number">01</span>看懂博主</a><a href="#discussion"><span class="nav-number">02</span>看评论归类</a><a href="#opportunities"><span class="nav-number">03</span>看内容建议</a></nav><div class="side-end">账号评论研究 · v1.6.1</div></aside><main class="main" id="main"><div class="report-actions"><p id="pdf-help">保存正文、图表与代表评论；打印窗口中选择“另存为 PDF”。</p><button class="pdf-button" id="download-pdf" type="button" aria-describedby="pdf-help">下载 PDF</button></div>@@BODY@@</main></div>
<script id="wordcloud-data" type="application/json">@@WORD_DATA@@</script><script>
  // PDF export uses the browser's local Save as PDF dialog.
  (() => {
    const button = document.getElementById('download-pdf');
    let previousStates = null;
    function preparePrint() {
      if (previousStates) return;
      previousStates = new Map();
      document.querySelectorAll('.insight details, .product-idea, #sources, .additional-topics, .extra-topic, .additional-opps, details.opportunity, .representative-more, .topic-explanation').forEach(detail => {
        previousStates.set(detail, detail.open);
        detail.open = true;
      });
    }
    function restoreView() {
      if (!previousStates) return;
      previousStates.forEach((open, detail) => { detail.open = open; });
      previousStates = null;
    }
    window.addEventListener('beforeprint', preparePrint);
    window.addEventListener('afterprint', restoreView);
    button?.addEventListener('click', async () => {
      button.disabled = true;
      try {
        await document.fonts.ready;
        window.print();
      } finally {
        button.disabled = false;
      }
    });
  })();

  // Discussion selection keeps all source text in the document for offline reading and print.
  (() => {
    const tiles = Array.from(document.querySelectorAll('.topic-tile'));
    const panels = Array.from(document.querySelectorAll('.topic-detail-column .topic-card'));
    function select(id, scroll = false) {
      const panel = document.getElementById('group-' + id);
      if (!panel) return;
      if (panels.includes(panel)) {
        panels.forEach(p => { p.hidden = p !== panel; });
        tiles.forEach(t => t.setAttribute('aria-pressed', String(t.dataset.topic === id)));
        document.querySelector('.topic-detail-column').scrollTop = 0;
      }
      let ancestor = panel.parentElement;
      while (ancestor) { if (ancestor.tagName === 'DETAILS') ancestor.open = true; ancestor = ancestor.parentElement; }
      const label = document.querySelector('.selected-topic-label');
      if (label) label.textContent = '正在看：' + panel.querySelector('h3').textContent;
      if (scroll) requestAnimationFrame(() => {
        const destination = window.innerWidth >= 900 && panels.includes(panel) ? document.querySelector('.topic-workspace') : panel;
        destination.scrollIntoView({block:'start'});
        panel.querySelector('h3').focus({preventScroll:true});
      });
    }
    tiles.forEach(tile => tile.addEventListener('click', () => {
      select(tile.dataset.topic, window.innerWidth < 900);
    }));
    if (tiles.length) select(tiles[0].dataset.topic);
    function followHash() {
      let id;
      try { id = decodeURIComponent(location.hash.slice(1)); } catch { return; }
      if (id.startsWith('group-')) select(id.slice(6), true);
      if (id.startsWith('op-')) {
        const target = document.getElementById(id);
        if (!target) return;
        let current = target;
        while (current) { if (current.tagName === 'DETAILS') current.open = true; current = current.parentElement; }
        requestAnimationFrame(() => target.scrollIntoView({block:'start'}));
      }
    }
    window.addEventListener('hashchange', followHash);
    document.querySelectorAll('a[href^="#group-"],a[href^="#op-"]').forEach(link => link.addEventListener('click', () => {
      if (location.hash === link.hash) followHash();
    }));
    followHash();

  })();

  // Keep the navigation aligned with the section currently being read.
  (() => {
    const entries = Array.from(document.querySelectorAll('.nav a[href^="#"]'))
      .map(link => ({link, section: document.getElementById(link.hash.slice(1))}))
      .filter(entry => entry.section);
    if (!entries.length) return;
    let scheduled = false;
    function update() {
      scheduled = false;
      const readingLine = Math.min(window.innerHeight * 0.35, 280);
      let current = entries[0];
      for (const entry of entries) {
        if (entry.section.getBoundingClientRect().top <= readingLine) current = entry;
      }
      for (const entry of entries) {
        if (entry === current) entry.link.setAttribute('aria-current', 'location');
        else entry.link.removeAttribute('aria-current');
      }
    }
    function schedule() {
      if (!scheduled) { scheduled = true; requestAnimationFrame(update); }
    }
    window.addEventListener('scroll', schedule, {passive: true});
    window.addEventListener('resize', schedule);
    window.addEventListener('hashchange', schedule);
    window.addEventListener('pageshow', schedule);
    document.addEventListener('toggle', schedule, true);
    const main = document.getElementById('main');
    if (main && typeof ResizeObserver !== 'undefined') new ResizeObserver(schedule).observe(main);
    document.fonts.ready.then(schedule);
    update();
  })();

  // Source links also work after the material section has been collapsed.
  document.querySelectorAll('a[href^="#source-"]').forEach(link => {
    link.addEventListener('click', () => { document.getElementById('sources').open = true; });
  });

  (() => {
    const data=JSON.parse(document.getElementById('wordcloud-data').textContent);
    const cloud=document.getElementById('comment-wordcloud');
    const panel=document.getElementById('wordcloud-evidence');
    const quotes=document.getElementById('wordcloud-quotes');
    const byId=new Map(data.comments.map(c=>[c.id,c]));
    if(!data.words.length){cloud.style.height='auto';cloud.textContent='当前材料没有适合展示的重复关键词，可直接查看下面的问题分类。';return;}
    const buttons=data.words.map(word=>{
      const button=document.createElement('button');
      button.type='button';button.className='cloud-word';button.textContent=word.term;
      button.dataset.term=word.term;button.dataset.count=word.count;
      button.title=word.term+' · 出现在'+word.count+'条评论';
      button.setAttribute('aria-label',button.title+'，点击查看原话');
      button.setAttribute('aria-controls','wordcloud-evidence');button.setAttribute('aria-pressed','false');
      button.addEventListener('click',()=>{
        buttons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
        document.getElementById('wordcloud-selected').textContent='“'+word.term+'” · 出现在'+word.count+'条评论';
        quotes.replaceChildren();
        word.comment_ids.forEach(id=>{
          const c=byId.get(id),q=document.createElement('blockquote');q.className='quote';q.dataset.commentId=id;
          const p=document.createElement('p');p.textContent='“'+c.text+'”';q.append(p);
          const footer=document.createElement('footer'),link=document.createElement('a'),likes=document.createElement('span');
          link.href='#source-'+c.note.toLowerCase();link.textContent=c.note+' · '+c.id+(c.parent_id?'（回复）':'（一级）');
          link.addEventListener('click',()=>document.getElementById('sources').open=true);
          likes.className='likes';likes.textContent=(c.likes===null?'点赞未知':c.likes+' 赞');footer.append(link,likes);q.append(footer);quotes.append(q);
        });
        panel.hidden=false;
      });
      cloud.append(button);return button;
    });
    let lastWidth=0;
    function layout(){
      const width=cloud.clientWidth;if(!width||Math.abs(lastWidth-width)<1)return;lastWidth=width;cloud.style.display='block';buttons.forEach(b=>b.style.position='absolute');
      const max=data.words[0]?.count||1,mobile=width<500;
      buttons.forEach((b,i)=>{
        const frequency=data.words[i].count;
        b.style.fontSize=((mobile?16:19)+(mobile?28:37)*(frequency-1)/Math.max(max-1,1))+'px';
        b.style.color=frequency>=4?'#A0622A':frequency>=2?'#C4843E':'#8C7B6A';
        b.style.fontWeight=frequency>=3?'750':'550';
      });
      let height=mobile?360:320;
      while(height<=960){
        const placed=[];let fits=true;
        for(let i=0;i<buttons.length;i++){
          const b=buttons[i],w=b.offsetWidth,h=b.offsetHeight;let spot=null;
          for(let t=0;t<7000;t++){
            const angle=t*.22+i*2.39996,radius=3.5*Math.sqrt(t);
            const x=width/2+Math.cos(angle)*radius-w/2,y=height/2+Math.sin(angle)*radius*.68-h/2;
            if(x<3||y<3||x+w>width-3||y+h>height-3)continue;
            if(placed.some(p=>x<p.x+p.w+3&&x+w+3>p.x&&y<p.y+p.h+3&&y+h+3>p.y))continue;
            spot={x,y,w,h};break;
          }
          if(!spot){fits=false;break;}placed.push(spot);
        }
        if(fits){cloud.style.height=height+'px';buttons.forEach((b,i)=>{b.style.left=placed[i].x+'px';b.style.top=placed[i].y+'px'});return;}
        height+=80;
      }
      // Keep every word usable even if an unusual font cannot fit the cloud.
      cloud.style.display='flex';cloud.style.flexWrap='wrap';cloud.style.justifyContent='center';cloud.style.alignItems='center';cloud.style.height='auto';
      buttons.forEach(b=>{b.style.position='static'});
    }
    document.getElementById('wordcloud-close').addEventListener('click',()=>{
      panel.hidden=true;const selected=buttons.find(b=>b.getAttribute('aria-pressed')==='true');
      buttons.forEach(b=>b.setAttribute('aria-pressed','false'));if(selected)selected.focus();
    });
    document.fonts.ready.then(layout);
    new ResizeObserver(()=>requestAnimationFrame(layout)).observe(cloud);
  })();
</script></body></html>
