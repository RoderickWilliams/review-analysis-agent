[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewagent"
version = "1.0.0"
description = "跨平台用户反馈智能分析：情绪识别、反讽与刷单检测、Trust Report 与 HTML 报告"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ReviewAgent contributors" }]
keywords = ["review", "sentiment", "llm", "trust-report", "ecommerce"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "openai>=1.40",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "jieba>=0.42.1",
  "pyarrow>=14.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "tenacity>=8.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
scrape = [
  "curl_cffi>=0.7",
  "selenium>=4.15",
  "webdriver-manager>=4.0",
  "DrissionPage>=4.1",
  "fake-useragent>=1.5",
  "patchright>=1.40",
  "playwright>=1.40",
]
scrapling = ["scrapling[fetchers]>=0.5"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]
app = ["streamlit>=1.30", "altair>=5.0", "pydeck>=0.8"]
api = ["fastapi>=0.110,<1", "pydantic>=2.7,<3", "uvicorn>=0.29", "python-multipart>=0.0.9"]
import = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]
all = [
  "openai>=1.40",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "jieba>=0.42.1",
  "pyarrow>=14.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "tenacity>=8.2",
  "tqdm>=4.66",
  "curl_cffi>=0.7",
  "selenium>=4.15",
  "webdriver-manager>=4.0",
  "DrissionPage>=4.1",
  "fake-useragent>=1.5",
  "patchright>=1.40",
  "playwright>=1.40",
  "pytesseract>=0.3.10",
  "Pillow>=10.0",
  "streamlit>=1.30",
  "altair>=5.0",
  "pydeck>=0.8",
  "fastapi>=0.110,<1",
  "pydantic>=2.7,<3",
  "openpyxl>=3.1",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "scrapling[fetchers]>=0.5",
]

[project.scripts]
reviewagent = "reviewagent.cli:main"

[project.urls]
Homepage = "https://github.com/RoderickWilliams/review-analysis-agent"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["reviewagent*"]

[tool.setuptools.package-data]
reviewagent = ["webui/*.html", "webui/*.css", "webui/*.js", "webui/*.png", "webui-classic/*.html", "webui-classic/*.css", "webui-classic/*.js", "webui-redesign/*.html", "webui-redesign/*.css", "webui-redesign/*.js"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
markers = ["live: 需要真实 LLM API Key 的测试"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
