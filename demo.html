<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ReviewAgent 演示工作台</title><link rel="stylesheet" href="demo.css?v=20261029"><script src="demo.js?v=20261029" defer></script></head>
<body><div class="workbench"><aside class="sidebar"><a class="brand" href="./" target="_top"><img src="assets/logo.png" alt="ReviewAgent"></a><div class="workspace"><span class="avatar">R</span><div>评论研究工作台<small>示例工作区</small></div></div><p class="nav-label">工作区</p><nav aria-label="演示工作台"><button data-view="overview" class="active"><span>▦</span>总览</button><button data-view="reviews"><span>☷</span>评论库 <b>12</b></button><button data-view="insights"><span>◷</span>用户洞察</button><button data-view="actions"><span>☑</span>行动计划</button></nav><p class="nav-label">记录</p><button class="history-nav" data-view="history">↶　分析历史</button><div class="sidebar-bottom"><button class="reset" id="reset">重置演示</button><span class="local-status">● 浏览器内演示</span><p>虚构样例数据<br>不会发起采集或模型请求</p></div></aside>
<div class="main"><header class="topbar"><span>评论研究 <small>演示模式</small></span><span class="demo-caption">仅供演示</span></header><main id="content"><div class="heading"><div><p id="subject" class="subject">植间 日常保湿护手霜</p><h1 id="page-title">研究总览 <span class="badge">已完成</span></h1></div><button class="button" id="export">导出样例</button></div><p class="notice">样例用于演示产品交互，商品、评论、统计及分析结果均为虚构。</p><div id="view"></div></main></div></div>
<dialog id="detail"><div class="dialog-head"><h2 id="detail-title">评论原文</h2><button class="icon-button" id="close" aria-label="关闭弹窗">×</button></div><div id="detail-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div></body></html>
