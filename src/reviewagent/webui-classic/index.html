<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>ReviewAgent · 对象层工作台</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314634a'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<a class="skip-link" href="#main">跳到正文</a>

<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="工作台导航">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><span>R</span></span>
      <div class="brand-copy">
        <strong>ReviewAgent</strong>
        <span>口碑工作台 <em>v2</em></span>
      </div>
    </div>

    <button class="btn btn-new" id="btn-new" type="button">
      <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
      新建分析
    </button>

    <div class="sidebar-scroll">
      <p class="nav-label">工作台</p>
      <nav class="side-nav" id="side-nav" aria-label="报告目录">
        <button class="side-link is-active" type="button" data-target="sec-overview" data-group="overview">
          <svg class="icon" aria-hidden="true"><use href="#i-layout"></use></svg><span>总览</span><b>01</b>
        </button>
        <button class="side-link" type="button" data-target="sec-object" data-group="overview">
          <svg class="icon" aria-hidden="true"><use href="#i-box"></use></svg><span>对象与同款</span><b>02</b>
        </button>
        <button class="side-link" type="button" data-target="sec-coverage" data-group="overview">
          <svg class="icon" aria-hidden="true"><use href="#i-database"></use></svg><span>平台覆盖</span><b>03</b>
        </button>
        <button class="side-link" type="button" data-target="sec-diagnosis" data-group="diagnosis">
          <svg class="icon" aria-hidden="true"><use href="#i-activity"></use></svg><span>口碑诊断</span><b>04</b>
        </button>
        <button class="side-link" type="button" data-target="sec-pains" data-group="diagnosis">
          <svg class="icon" aria-hidden="true"><use href="#i-target"></use></svg><span>痛点图谱</span><b>05</b>
        </button>
        <button class="side-link" type="button" data-target="sec-competitors" data-group="diagnosis">
          <svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg><span>竞品对照</span><b>06</b>
        </button>
        <button class="side-link" type="button" data-target="sec-improvements" data-group="growth">
          <svg class="icon" aria-hidden="true"><use href="#i-spark"></use></svg><span>增长机会</span><b>07</b>
        </button>
        <button class="side-link" type="button" data-target="sec-topics" data-group="growth">
          <svg class="icon" aria-hidden="true"><use href="#i-pen"></use></svg><span>内容选题</span><b>08</b>
        </button>
        <button class="side-link" type="button" data-target="sec-content" data-group="growth">
          <svg class="icon" aria-hidden="true"><use href="#i-file"></use></svg><span>内容生产包</span><b>09</b>
        </button>
        <button class="side-link" type="button" data-target="sec-ops" data-group="ops">
          <svg class="icon" aria-hidden="true"><use href="#i-compass"></use></svg><span>运营方案</span><b>10</b>
        </button>
        <button class="side-link" type="button" data-target="sec-actions" data-group="ops">
          <svg class="icon" aria-hidden="true"><use href="#i-check-list"></use></svg><span>行动清单</span><b>11</b>
        </button>
        <button class="side-link" type="button" data-target="sec-evidence" data-group="evidence">
          <svg class="icon" aria-hidden="true"><use href="#i-shield"></use></svg><span>证据与方法</span><b>12</b>
        </button>
      </nav>

      <p class="nav-label nav-label-spaced">关于</p>
      <button class="side-link side-link-quiet" type="button" id="btn-about-side">
        <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg><span>数据边界与说明</span>
      </button>
      <a class="side-link side-link-quiet" href="https://github.com/" target="_blank" rel="noreferrer">
        <svg class="icon" aria-hidden="true"><use href="#i-github"></use></svg><span>项目仓库</span>
      </a>
    </div>

    <div class="side-foot">
      <div class="side-foot-title"><span class="status-dot"></span>只在本机运行</div>
      <p>不登录抓取，不调用第三方面板；解析结果来自公开页面。</p>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn menu-btn" id="btn-menu" type="button" aria-label="打开目录" aria-controls="sidebar" aria-expanded="false">
          <svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg>
        </button>
        <div class="crumbs">
          <span>工作台</span><i>/</i><strong id="crumb-title">新建分析</strong>
        </div>
      </div>
      <div class="topbar-right">
        <span class="local-pill" title="本机 FastAPI 服务"><span class="status-dot"></span>本地解析</span>
        <div class="ui-switch" role="group" aria-label="界面版本">
          <a class="is-current" href="/app/">续作版</a>
          <a href="/app-redesign/">重设计版</a>
        </div>
        <button class="icon-btn" id="btn-print" type="button" aria-label="打印或导出 PDF" title="打印 / PDF">
          <svg class="icon" aria-hidden="true"><use href="#i-printer"></use></svg>
        </button>
        <button class="icon-btn" id="btn-theme" type="button" aria-label="切换深浅色" title="切换深浅色">
          <svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg>
        </button>
        <button class="icon-btn" id="btn-about" type="button" aria-label="关于数据边界" title="关于">
          <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>
        </button>
      </div>
    </header>

    <main class="main" id="main">
      <section class="search-zone" id="search-zone" aria-label="输入分析对象"></section>
      <div class="report-summary" id="report-summary"></div>
      <div class="tabs-zone" id="tabs-zone" hidden></div>
      <div class="content" id="content" aria-live="polite"></div>
    </main>

    <footer class="footer">
      <span>ReviewAgent v2 · 对象层预览</span>
      <span>所有解析与报告在本机生成 · 不把演示数据写进结论 · <a href="/app-redesign/">重设计版</a> · <a href="/app-classic/">旧版</a></span>
    </footer>
  </div>
</div>

<div class="sidebar-scrim" id="sidebar-scrim" hidden></div>
<div class="toast-root" id="toast-root" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

</svg>

<script src="./app.js"></script>
</body>
</html>
